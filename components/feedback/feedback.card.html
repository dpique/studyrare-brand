<!-- @dsCard group="Components" viewport="700x380" name="Progress, Toast & Tooltip" subtitle="Feedback & status" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); color: var(--text-body); }
  .wrap { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); }
  .label { font-size: var(--text-2xs); font-weight: 700; letter-spacing: var(--tracking-caps); text-transform: uppercase; color: var(--text-subtle); }
  .bars { display: flex; flex-direction: column; gap: var(--space-4); max-width: 460px; }
  .toasts { display: flex; flex-direction: column; gap: var(--space-3); }
  .ttrow { display: flex; gap: var(--space-6); align-items: center; padding-top: var(--space-6); }
  .pill { font-family: var(--font-display); font-weight: 700; font-size: var(--text-sm); background: var(--surface-card); border: 1.5px solid var(--border-default); border-radius: var(--radius-pill); padding: 8px 14px; cursor: default; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script type="text/babel">
    const { ProgressBar, Toast, Tooltip } = window.StudyRareDesignSystem_cad071;
    function Demo() {
      return (
        <div className="wrap">
          <div>
            <div className="label" style={{marginBottom:'14px'}}>Progress</div>
            <div className="bars">
              <ProgressBar label="Metabolic genetics" value={64} showValue />
              <ProgressBar label="Course completion" variant="accent" value={42} showValue />
              <ProgressBar segments={[{value:62,variant:'correct'},{value:23,variant:'incorrect'}]} />
            </div>
          </div>
          <div>
            <div className="label" style={{marginBottom:'14px'}}>Toasts</div>
            <div className="toasts">
              <Toast variant="correct" title="Correct!" onClose={()=>{}}>+10 points · 3-day streak going strong</Toast>
              <Toast variant="incorrect" title="Not quite" onClose={()=>{}}>Review the explanation below.</Toast>
            </div>
          </div>
          <div className="ttrow">
            <span className="label">Tooltip →</span>
            <Tooltip content="ABMGG = American Board of Medical Genetics &amp; Genomics"><span className="pill">Hover: ABMGG</span></Tooltip>
            <Tooltip content="Flag this question for later review" placement="bottom"><span className="pill">Hover: Flag</span></Tooltip>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
  </script>
</body>
</html>
